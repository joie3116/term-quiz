<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>용어 퀴즈</title>
  <!-- 탭 아이콘을 따로 요청하지 않게 빈 아이콘을 둔다 (콘솔에 아이콘 404 에러가 남지 않게) -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- 확인용 날짜: 주소 끝에 ?today=YYYY-MM-DD를 붙였을 때만 모든 화면 맨 위에 보인다 (SPEC 「저장과 날짜」) -->
    <p id="test-date" class="test-date" hidden></p>
    <!-- 멈춤 안내: 확인용 주소가 잘못됐거나, 기록을 읽거나 저장하지 못했을 때 -->
    <p id="alert" class="alert" role="alert" hidden></p>

    <!-- 처음 화면 (SPEC 「처음 화면」) -->
    <section id="home-screen">
      <h1>용어 퀴즈</h1>
      <p id="home-date" class="sub"></p>
      <ul id="home-counts" class="counts">
        <li id="home-review"></li>
        <li id="home-new"></li>
        <li id="home-mastered"></li>
      </ul>
      <div class="button-row">
        <button type="button" id="review-button" disabled>복습 시작</button>
        <button type="button" id="learn-button">새 용어 배우기</button>
        <button type="button" id="status-button">현황 보기</button>
      </div>
    </section>

    <!-- 설명 화면 (SPEC 「새 용어 배우기」): 한 화면에 용어 하나 -->
    <section id="learn-screen" hidden>
      <p id="learn-progress" class="sub"></p>
      <p id="learn-group" class="sub"></p>
      <h2 id="learn-term" class="term-name"></h2>
      <div id="learn-details" class="details"></div>
      <button type="button" id="learn-next" class="primary">읽었어, 다음</button>
    </section>

    <!-- 문제 화면 (SPEC 「문제 화면」): 장면만 보여 주고 용어 이름은 숨긴다 -->
    <section id="quiz-screen" hidden>
      <div class="quiz-top">
        <p id="quiz-remaining" class="sub"></p>
        <button type="button" id="quiz-home">처음으로</button>
      </div>
      <p id="quiz-prompt" class="prompt"></p>

      <!-- 답 쓰기 -->
      <div id="answer-area">
        <textarea id="answer-input" class="answer-input" rows="6" maxlength="500" aria-label="답 쓰는 칸"></textarea>
        <p id="answer-limit" class="limit" hidden>500자까지 쓸 수 있어</p>
        <div class="button-row">
          <button type="button" id="check-button" class="primary" disabled>답 확인</button>
          <button type="button" id="dunno-button">모르겠어</button>
        </div>
      </div>

      <!-- 채점 칸: [답 확인]이면 체크칸과 함께 열고, [모르겠어]면 체크칸 없이 연다 -->
      <div id="grading-area" hidden>
        <div id="my-answer-box">
          <h3 class="label">내가 쓴 답</h3>
          <p id="my-answer" class="my-answer"></p>
        </div>
        <h3 class="label">핵심 요소</h3>
        <p id="grading-guide" class="guide">내 답에 이 뜻이 있으면 체크해. 말이 달라도 뜻이 같으면 돼.</p>
        <ul id="unit-list" class="units"></ul>
        <div id="wrong-box">
          <h3 class="label">흔한 오답</h3>
          <p id="wrong-text" class="wrong-text"></p>
          <label id="wrong-label" class="check">
            <input type="checkbox" id="wrong-check">
            <span>내 답이 이쪽이었어</span>
          </label>
        </div>
        <button type="button" id="grade-done" class="primary">채점 끝</button>
      </div>

      <!-- 판정과 그 카드의 용어 이름·설명 -->
      <div id="result-area" hidden>
        <p id="verdict" class="verdict"></p>
        <h2 id="result-term" class="term-name"></h2>
        <div id="result-details" class="details"></div>
        <button type="button" id="next-card" class="primary">다음 카드</button>
      </div>
    </section>

    <!-- 현황 화면 (SPEC 「현황 화면」): 요약 → 용어 표 → 오늘 쓴 답 → [기록 초기화]. 기록을 읽어서 보여 주기만 한다 -->
    <section id="status-screen" hidden>
      <div class="status-top">
        <h1>현황</h1>
        <button type="button" id="status-home">처음으로</button>
      </div>

      <!-- 요약: 익힌 용어 수, 상자별 카드 수 -->
      <ul class="counts">
        <li id="status-mastered"></li>
      </ul>
      <table class="box-table">
        <caption id="box-caption" class="label"></caption>
        <thead>
          <tr>
            <th scope="col">아직</th>
            <th scope="col">상자 1</th>
            <th scope="col">상자 2</th>
            <th scope="col">상자 3</th>
            <th scope="col">익힘</th>
          </tr>
        </thead>
        <tbody>
          <tr id="box-counts"></tr>
        </tbody>
      </table>

      <!-- 표: 용어를 번호 순으로 -->
      <h2 class="status-title">용어별 상태</h2>
      <table class="term-table">
        <thead>
          <tr>
            <th scope="col" class="col-id">번호</th>
            <th scope="col" class="col-term">용어</th>
            <th scope="col" class="col-group">묶음</th>
            <th scope="col" class="col-state">상태</th>
            <th scope="col" class="col-due">다음 복습 날짜</th>
          </tr>
        </thead>
        <tbody id="term-rows"></tbody>
      </table>

      <!-- 오늘 쓴 답: 오늘 첫 시도한 카드 (카드 번호 순). [전부 복사]로 넣는 글과 같은 모양으로 보여 준다 -->
      <h2 class="status-title">오늘 쓴 답</h2>
      <p id="today-summary" class="sub"></p>
      <div class="button-row">
        <button type="button" id="copy-button">전부 복사</button>
      </div>
      <p id="copy-message" class="copy-message" role="status" hidden></p>
      <ol id="today-list" class="today-list"></ol>

      <div class="reset-row">
        <button type="button" id="reset-button">기록 초기화</button>
      </div>
    </section>
  </main>

  <!-- 데이터를 app.js보다 먼저 불러온다 (SPEC 「데이터」) -->
  <script src="terms-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
