<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>용어 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- 첫 화면: 공부 시작, 시험, 초기화 실패 안내, 시험 기록, 기록 초기화 (결정 사항 10) -->
    <section id="home-screen">
      <h1>용어 퀴즈</h1>
      <button type="button" id="study-button" class="study-button">공부 시작 (67개, 맞출 때까지)</button>
      <button type="button" id="exam-button" class="exam-button">시험 (67문제, 57점 통과)</button>
      <p id="home-message" class="home-message" hidden></p>

      <h2 class="exam-title">시험 기록</h2>
      <p id="exam-empty" class="exam-empty" hidden>아직 시험 기록이 없습니다</p>
      <ul id="exam-list" class="exam-list"></ul>

      <button type="button" id="reset-button" class="reset-button">기록 초기화</button>
    </section>

    <!-- 문제 화면: 위 줄(이전 문제 · 진행 표시는 공부일 때만 · 처음으로) + 용어 하나 + 뜻 4개 (결정 사항 7·8) -->
    <section id="quiz-screen" hidden>
      <div class="quiz-bar">
        <button type="button" id="prev-button" class="bar-button" disabled>이전 문제</button>
        <p id="progress" class="progress" hidden></p>
        <button type="button" id="quit-button" class="bar-button quit-button">처음으로</button>
      </div>
      <h2 class="question">
        <span id="term"></span>
        <span id="look-only" class="look-only" hidden>(알아보기만)</span>
      </h2>
      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback" hidden>
        <p id="verdict" class="verdict"></p>
        <p><span class="label">정답 뜻</span> <span id="answer"></span></p>
        <p><span class="label">비유</span> <span id="analogy"></span></p>
      </div>
      <button type="button" id="next-button" class="next-button" hidden>다음</button>
    </section>

    <!-- 결과 화면: 점수와 틀린 용어 번호. 시험일 때만 통과/미통과와 기록 저장 실패 줄이 보인다 -->
    <section id="result-screen" hidden>
      <h2>결과</h2>
      <p class="score"><span class="label">점수</span> <span id="score"></span></p>
      <p id="pass-result" class="pass-result" hidden></p>
      <p><span class="label">틀린 용어 번호</span> <span id="wrong-list"></span></p>
      <p id="exam-save-error" class="save-error" hidden>시험 기록을 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.</p>
      <button type="button" id="home-button" class="home-button">처음으로</button>
    </section>

    <!-- 공부 결과 화면: 푼 문제 수, 한 번에 맞춘 개수, 두 번 이상 나온 용어 (결정 사항 4). 저장하지 않는다 -->
    <section id="study-result-screen" hidden>
      <h2>공부 결과</h2>
      <p class="score"><span class="label">푼 문제</span> <span id="study-solved"></span></p>
      <p class="score"><span class="label">한 번에 맞춘 개수</span> <span id="study-first"></span></p>
      <p><span class="label">두 번 이상 나온 용어</span> <span id="study-repeat-none" hidden>없음</span></p>
      <ul id="study-repeat-list" class="repeat-list"></ul>
      <button type="button" id="study-home-button" class="home-button">처음으로</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
